name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The GitHub Ubuntu image already ships JDK 17 and the Android SDK; every step logs to a file
      # that is published to the build-output branch so it can be read without the Actions UI.
      - name: Environment
        run: |
          mkdir -p logs
          {
            echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 || true
          } 2>&1 | tee logs/env.log
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > logs/licenses.log 2>&1 || true
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee logs/build.log

      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee logs/test.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EHS-TBT-Tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish build output branch
        if: always()
        run: |
          mkdir -p out
          cp -r logs out/ 2>/dev/null || true
          mkdir -p out/test-reports && cp -r app/build/test-results/testDebugUnitTest/*.xml out/test-reports/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk out/ 2>/dev/null || true
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > out/STATUS.txt
          cd out
          git init -q
          git checkout -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build output for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output
