name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local config (secrets override gradle.properties only when set)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "${{ secrets.EHS_WEB_APP_URL }}" ]; then echo "EHS_WEB_APP_URL=${{ secrets.EHS_WEB_APP_URL }}" >> local.properties; fi
          if [ -n "${{ secrets.EHS_API_TOKEN }}" ]; then echo "EHS_API_TOKEN=${{ secrets.EHS_API_TOKEN }}" >> local.properties; fi
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee test.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EHS-TBT-Tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Copies the APK and logs to a "build-output" branch so they can be fetched with plain git.
      - name: Publish build output branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp test.log out/ 2>/dev/null || true
          mkdir -p out/test-reports && cp -r app/build/test-results/testDebugUnitTest/*.xml out/test-reports/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk out/ 2>/dev/null || true
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > out/STATUS.txt
          cd out
          git init -q
          git checkout -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build output for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output
